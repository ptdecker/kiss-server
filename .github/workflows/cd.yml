name: CD

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Semver tag to deploy (e.g. v1.2.3 — must already exist on origin)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate semver tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_TAG="${{ inputs.tag }}"
            if ! git tag | grep -qx "$VERSION_TAG"; then
              echo "::error::Tag $VERSION_TAG not found in repo. Push the tag before dispatching."
              exit 1
            fi
          else
            VERSION_TAG="${{ github.ref_name }}"
          fi
          if ! echo "$VERSION_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid semver tag format: $VERSION_TAG"
            exit 1
          fi
          echo "tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying $VERSION_TAG"

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate CHANGELOG entry
        id: changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Strip leading 'v' for CHANGELOG lookup: v1.1.0 -> 1.1.0
          VERSION="${TAG#v}"
          # Extract section between ## [VERSION] and the next ## [ heading
          BODY=$(awk -v ver="$VERSION" 'index($0, "## [" ver "]") == 1 { found=1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            echo "::error::CHANGELOG.md has no entry for version ${VERSION}. Add a ## [${VERSION}] section."
            exit 1
          fi
          # Write body to file for multi-line output
          echo "$BODY" > /tmp/release-body.md
          echo "Found CHANGELOG entry for ${VERSION}"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.EC2_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            target/release/kiss-server \
            ec2-user@54.83.192.65:/tmp/kiss-server-new
          ssh -i ~/.ssh/deploy_key ec2-user@54.83.192.65 \
            "sudo systemctl stop kiss-server && \
             sudo mv /tmp/kiss-server-new /usr/local/bin/kiss-server && \
             sudo chmod +x /usr/local/bin/kiss-server && \
             sudo systemctl start kiss-server"

      - name: Verify service is active
        run: |
          ssh -i ~/.ssh/deploy_key ec2-user@54.83.192.65 \
            "sudo systemctl is-active kiss-server"

      - name: Invalidate CloudFront cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "CloudFront invalidation created: $INVALIDATION_ID"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "${{ steps.version.outputs.tag }} (${{ steps.sha.outputs.short }})"
          body_path: /tmp/release-body.md
          files: target/release/kiss-server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
