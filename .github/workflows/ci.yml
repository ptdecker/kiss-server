name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: Check version consistency
        run: |
          set -euo pipefail
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          CHANGELOG_VERSION=$(grep -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -1 | sed 's/^## \[\(.*\)\].*/\1/')
          if [ -z "${CARGO_VERSION}" ] || [ -z "${CHANGELOG_VERSION}" ]; then
            echo "::error::Failed to determine versions: Cargo.toml='${CARGO_VERSION:-}' CHANGELOG.md='${CHANGELOG_VERSION:-}'"
            exit 1
          fi
          if [ "${CARGO_VERSION}" != "${CHANGELOG_VERSION}" ]; then
            echo "::error::Version mismatch: Cargo.toml=${CARGO_VERSION} but latest CHANGELOG.md entry=${CHANGELOG_VERSION}"
            exit 1
          fi
          echo "Versions consistent: ${CARGO_VERSION}"
      - name: Run CI
        run: ./scripts/ci.sh
